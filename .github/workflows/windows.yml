name: Windows release build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pytest
      - name: Offline tests
        run: python -m pytest -q

  windows-installer:
    needs: test-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build and test
        shell: pwsh
        run: .\packaging\build_windows.ps1
      - name: Smoke-test packaged GUI
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\dist\PlaylistFusion\PlaylistFusion.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "Packaged GUI terminated immediately" }
          Stop-Process -Id $p.Id -Force
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistFusion-Windows
          path: |
            dist/installer/PlaylistFusion-Setup.exe
            dist/installer/PlaylistFusion-Portable.zip
          if-no-files-found: error
          retention-days: 30
